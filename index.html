<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>MetGeo360 | Proje Haritası</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css" />
    <script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>

    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: 'Segoe UI', sans-serif; background: #000; }
        #map { height: 100%; width: 100%; }
        
        /* Marka Logosu (Sol Üst) */
        .brand-box {
            position: absolute;
            top: 20px; left: 20px; z-index: 1000;
            background: rgba(0, 0, 0, 0.85);
            color: #f1c40f;
            padding: 12px 20px;
            border-radius: 8px;
            border-left: 4px solid #f1c40f;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .brand-box h1 { margin: 0; font-size: 22px; letter-spacing: 1px; font-weight: 700; }
        .brand-box p { margin: 4px 0 0; color: #ccc; font-size: 11px; letter-spacing: 1px; }

        /* -------------------------------------------------- */
        /* YENİ SİYAH-SARI ANİMASYONLU KÜME İKONU TASARIMI */
        /* -------------------------------------------------- */
        .custom-cluster-icon {
            background-color: #000; /* Siyah arka plan */
            color: #f1c40f; /* Sarı yazı */
            border: 2px solid #f1c40f; /* Sarı çerçeve */
            border-radius: 50%; /* Tam yuvarlak */
            text-align: center;
            font-weight: 800;
            font-size: 16px;
            line-height: 38px; /* Yazıyı dikey ortala */
            /* Kalp atışı animasyonunu uygula */
            animation: pulse 1.8s infinite; 
            box-shadow: 0 0 0 0 rgba(241, 196, 15, 0.7);
        }

        /* Kalp Atışı (Pulse) Animasyonu Keyframes */
        @keyframes pulse {
            0% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(241, 196, 15, 0.7);
            }
            70% {
                transform: scale(1);
                box-shadow: 0 0 0 15px rgba(241, 196, 15, 0); /* Gölge genişleyip kayboluyor */
            }
            100% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(241, 196, 15, 0);
            }
        }

        /* Popup (Baloncuk) Tasarımı */
        .leaflet-popup-content-wrapper { border-radius: 8px; padding: 0; overflow: hidden; border: 2px solid #f1c40f; }
        .leaflet-popup-content { margin: 0; width: 280px !important; }
        .leaflet-popup-tip { background: #f1c40f; }
        .popup-img { width: 100%; height: 160px; object-fit: cover; display: block; border-bottom: 2px solid #f1c40f; }
        .popup-info { padding: 15px; text-align: center; background: #111; color: #fff; }
        .popup-info h3 { margin: 0 0 12px; color: #f1c40f; font-size: 18px; letter-spacing: 1px; }
        .btn-git {
            display: block; background: #f1c40f; color: #000; width: 80%; margin: 0 auto;
            text-decoration: none; padding: 10px 0; font-weight: 800; letter-spacing: 1px;
            border-radius: 4px; transition: 0.3s; text-transform: uppercase;
        }
        .btn-git:hover { background: #d4ac0d; transform: translateY(-2px); }
    </style>
</head>
<body>

    <div class="brand-box">
        <h1>METGEO360</h1>
        <p>METEHAN HARİTA MÜHENDİSLİK</p>
    </div>

    <div id="map"></div>

    <script>
        // Haritayı Başlat (Türkiye Geneli Bakış)
        var map = L.map('map', {zoomControl: false}).setView([39.0, 35.5], 6);
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        // Google Hibrit Harita Katmanı
        L.tileLayer('http://{s}.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
            maxZoom: 21,
            subdomains: ['mt0', 'mt1', 'mt2', 'mt3']
        }).addTo(map);

        // --------------------------------------------------
        // KÜMELEME AYARLARI (İstediğin Davranış İçin)
        // --------------------------------------------------
        var markers = L.markerClusterGroup({
            spiderfyOnMaxZoom: false, // ÖNEMLİ: 1. resimdeki dağılma efektini KAPATIR.
            showCoverageOnHover: false, // Fareyle üzerine gelince mavi sınır çıkmasın.
            zoomToBoundsOnClick: true, // Tıklayınca o bölgeye yaklaşsın.
            
            // Kendi Siyah-Sarı Animasyonlu İkonumuzu Tanımlıyoruz
            iconCreateFunction: function(cluster) {
                var count = cluster.getChildCount(); // Kümedeki sayı
                return L.divIcon({
                    html: count, // Sayıyı içine yaz
                    className: 'custom-cluster-icon', // Yukarıdaki CSS sınıfını kullan
                    iconSize: L.point(40, 40) // Boyut
                });
            }
        });

        // Verileri Çek ve İşle
        fetch('tours.json?v=' + new Date().getTime()) // Önbellek sorununu çözmek için
            .then(response => response.json())
            .then(data => {
                data.forEach(tur => {
                    // Özel Konum İkonu (Sarı Pin)
                    var myIcon = L.icon({
                        iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-gold.png',
                        shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
                        iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41]
                    });

                    var marker = L.marker([tur.lat, tur.lng], {icon: myIcon});
                    
                    var popupIcerik = `
                        <div>
                            <img src="${tur.resim}" class="popup-img">
                            <div class="popup-info">
                                <h3>${tur.isim}</h3>
                                <a href="${tur.url}" class="btn-git" target="_blank">TURU BAŞLAT</a>
                            </div>
                        </div>
                    `;
                    
                    marker.bindPopup(popupIcerik);
                    markers.addLayer(marker);
                });
                map.addLayer(markers);
                
                // Tüm noktalar yüklendikten sonra hepsini görecek şekilde haritayı ortala
                if (data.length > 0) {
                    map.fitBounds(markers.getBounds(), {padding: [50, 50]});
                }
            })
            .catch(err => console.error("Veri okunamadı:", err));
    </script>
</body>
</html>
