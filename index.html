<!DOCTYPE html>
<html lang="tr">
<head>
<link rel="icon" type="image/png" href="favicon.svg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MetGeo360 | Çok Yakında</title>
    <style>
        body, html {
            height: 100%;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .bg {
            /* Arkaplan resmi ayarları */
            background-image: url('arkaplan.jpg');
            height: 100%;
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            position: relative;
        }

        .overlay {
            /* Resmin üzerine hafif siyah perde çeker, yazı okunsun diye */
            background-color: rgba(0,0,0, 0.6); 
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            padding: 20px;
        }

        h1 {
            font-size: 4rem;
            margin-bottom: 0.2em;
            letter-spacing: 5px;
            text-transform: uppercase;
            font-weight: 300;
        }

        h2 {
            font-size: 2rem;
            color: #f1c40f; /* Altın sarısı renk */
            margin-top: 0;
            font-weight: 600;
        }

        p {
            font-size: 1.2rem;
            margin-top: 20px;
            color: #ddd;
        }

        /* Mobilde yazılar küçülsün */
        @media (max-width: 768px) {
            h1 { font-size: 2.5rem; }
            h2 { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

<div class="bg">
    <div class="overlay">
        <h1>METGEO360</h1>
        <h2>ÇOK YAKINDA HİZMETİNİZDEYİZ</h2>
        <p>Türkiye'nin Dijital İkizi Üzerinde Çalışıyoruz.</p>
    </div>
</div>

</body>
</html>
