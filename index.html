<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>MetGeo360 | Proje Portföyü</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css" />
    <script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>

    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: 'Segoe UI', sans-serif; background: #000; }
        #map { height: 100%; width: 100%; z-index: 1; }
        .leaflet-control-attribution { display: none !important; }

        /* Sol Üst Logo */
        .brand-box {
            position: absolute; top: 20px; left: 20px; z-index: 1000;
            background: rgba(0, 0, 0, 0.9); color: #f1c40f; padding: 12px 20px;
            border-radius: 4px; border-left: 5px solid #f1c40f;
            box-shadow: 0 5px 20px rgba(0,0,0,0.8);
        }
        .brand-box h1 { margin: 0; font-size: 20px; font-weight: 800; }
        .brand-box p { margin: 3px 0 0; color: #fff; font-size: 10px; opacity: 0.8; }

        /* SİYAH-SARI İKONLAR */
        .metgeo-icon {
            background-color: #000; color: #f1c40f; border: 2px solid #f1c40f;
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
            font-weight: 900; box-shadow: 0 0 15px rgba(241, 196, 15, 0.4);
            animation: pulse 2s infinite;
        }
        .single-marker { font-size: 0; }
        .single-marker::after { content: ''; width: 8px; height: 8px; background: #f1c40f; border-radius: 50%; }

        @keyframes pulse {
            0% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(241, 196, 15, 0.7); }
            70% { transform: scale(1.1); box-shadow: 0 0 0 10px rgba(241, 196, 15, 0); }
            100% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(241, 196, 15, 0); }
        }

        /* Liste Popup Tasarımı */
        .leaflet-popup-content-wrapper { background: #1a1a1a; border: 1px solid #f1c40f; color: #fff; border-radius: 4px; }
        .leaflet-popup-content { margin: 0; width: 280px !important; max-height: 350px; overflow-y: auto; }
        .leaflet-popup-tip { background: #f1c40f; }

        /* Butonlar */
        .popup-btn { display: block; background: #f1c40f; color: #000; padding: 10px; text-align: center; text-decoration: none; font-weight: bold; }
        .cluster-list { list-style: none; padding: 0; margin: 0; }
        .cluster-item { display: flex; align-items: center; padding: 10px; text-decoration: none; color: #fff; border-bottom: 1px solid #333; }
        .cluster-thumb { width: 40px; height: 40px; margin-right: 10px; object-fit: cover; border-radius: 3px; }
        
        /* Layer Control (3D Buton) */
        .leaflet-control-layers { background: #000 !important; border: 2px solid #f1c40f !important; color: #fff !important; }
    </style>
</head>
<body>
    <div class="brand-box">
        <h1>METGEO360</h1>
        <p>METEHAN HARİTA MÜHENDİSLİK</p>
    </div>
    <div id="map"></div>

    <script>
        // 1. HARİTA KATMANLARI (HTTPS DÜZELTMESİ YAPILDI)
        var sadeHarita = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            subdomains: 'abcd', maxZoom: 20
        });

        // Google Hybrid (HTTPS Linki - Sorunu Çözen Kısım)
        var uyduHarita = L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
            maxZoom: 21
        });

        var map = L.map('map', {
            center: [39.0, 35.5], zoom: 6,
            layers: [sadeHarita], zoomControl: false
        });
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        var baseMaps = { "Sade Harita": sadeHarita, "Uydu (3D)": uyduHarita };
        L.control.layers(baseMaps, null, { position: 'topright' }).addTo(map);

        // 2. KÜMELEME
        var markers = L.markerClusterGroup({
            showCoverageOnHover: false, zoomToBoundsOnClick: false, spiderfyOnMaxZoom: false, maxClusterRadius: 40,
            iconCreateFunction: function(cluster) {
                return L.divIcon({ html: cluster.getChildCount(), className: 'metgeo-icon', iconSize: L.point(40, 40) });
            }
        });

        // 3. VERİ ÇEKME
        fetch('tours.json?v=' + new Date().getTime())
            .then(response => response.json())
            .then(data => {
                data.forEach(tur => {
                    // Varsayılan koordinat kontrolü (Hata ayıklama için)
                    if(tur.lat == 37.8716 && tur.lng == 32.4853) {
                        console.log(tur.isim + " projesinin koordinat.txt dosyası EKSİK! Varsayılan yere atıldı.");
                    }

                    var singleIcon = L.divIcon({ className: 'metgeo-icon single-marker', iconSize: [20, 20] });
                    var marker = L.marker([tur.lat, tur.lng], {icon: singleIcon});
                    marker.turVerisi = tur;

                    var tekilPopup = `<div><img src="${tur.resim}" style="width:100%;height:150px;object-fit:cover;">
                        <h3 style="text-align:center;color:#f1c40f;margin:10px 0;">${tur.isim}</h3>
                        <a href="${tur.url}" class="popup-btn">TURU AÇ ►</a></div>`;
                    marker.bindPopup(tekilPopup);
                    markers.addLayer(marker);
                });

                markers.on('clusterclick', function (a) {
                    var childMarkers = a.layer.getAllChildMarkers();
                    var html = '<div style="padding:10px;text-align:center;background:#000;border-bottom:2px solid #f1c40f;font-weight:bold;">BÖLGEDEKİ PROJELER</div><ul class="cluster-list">';
                    childMarkers.forEach(function(m) {
                        var t = m.turVerisi;
                        html += `<li><a href="${t.url}" class="cluster-item"><img src="${t.resim}" class="cluster-thumb">
                            <div><div style="color:#f1c40f;font-weight:bold;">${t.isim}</div><div style="font-size:11px;color:#ccc;">Turu Görüntüle ►</div></div></a></li>`;
                    });
                    html += '</ul>';
                    L.popup().setLatLng(a.latlng).setContent(html).openOn(map);
                });

                map.addLayer(markers);
            });
    </script>
</body>
</html>
