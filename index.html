<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>MetGeo360 | Mapbox Profesyonel</title>
    
    <script src='https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js'></script>
    <link href='https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css' rel='stylesheet' />

    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; }
        #map { height: 100%; width: 100%; }

        /* LOGO */
        .brand-box {
            position: absolute; top: 20px; left: 20px; z-index: 10;
            background: rgba(0, 0, 0, 0.9); color: #f1c40f; padding: 15px;
            border-left: 5px solid #f1c40f; border-radius: 5px;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            pointer-events: none;
        }
        .brand-box h1 { margin: 0; font-size: 20px; font-weight: 800; letter-spacing: 1px; }
        .brand-box p { margin: 2px 0 0; color: #fff; font-size: 10px; letter-spacing: 2px; }

        /* SİYAH-SARI İĞNE TASARIMI */
        .mapbox-marker {
            width: 24px; height: 24px;
            background: #000; border: 2px solid #f1c40f; border-radius: 50%;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 10px #f1c40f;
            animation: pulse 2s infinite;
        }
        .mapbox-marker::after {
            content: ''; width: 8px; height: 8px; background: #f1c40f; border-radius: 50%;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(241, 196, 15, 0.7); transform: scale(0.95); }
            70% { box-shadow: 0 0 0 12px rgba(241, 196, 15, 0); transform: scale(1.1); }
            100% { box-shadow: 0 0 0 0 rgba(241, 196, 15, 0); transform: scale(0.95); }
        }

        /* POPUP TASARIMI */
        .mapboxgl-popup-content { background: #111 !important; color: #fff !important; border: 1px solid #f1c40f !important; padding: 0 !important; border-radius: 4px !important; overflow: hidden;
