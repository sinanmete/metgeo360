<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>MetGeo360 | Coğrafi Bilgi Portalı</title>
    
    <script src='https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js'></script>
    <link href='https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css' rel='stylesheet' />

    <style>
        /* TEMEL AYARLAR */
        :root {
            --primary: #F89714;
            --bg-glass: rgba(15, 15, 15, 0.75);
            --border-glass: rgba(255, 255, 255, 0.1);
        }
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #000; font-family: 'Segoe UI', Roboto, Helvetica, sans-serif; }
        #map { height: 100%; width: 100%; }

        /* --- GİRİŞ EKRANI (MODAL) --- */
        #intro-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            z-index: 9999; display: flex; justify-content: center; align-items: center;
            opacity: 1; transition: opacity 0.6s ease;
        }
        .intro-box {
            background: var(--bg-glass); border: 1px solid var(--border-glass); padding: 40px;
            max-width: 600px; width: 90%; text-align: center; color: #fff;
            position: relative; box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            border-radius: 12px;
        }
        .intro-close {
            position: absolute; top: 15px; right: 20px; font-size: 28px;
            color: #888; cursor: pointer; transition: 0.3s;
        }
        .intro-close:hover { color: var(--primary); }
        .intro-title { 
            color: var(--primary); font-size: 22px; margin-bottom: 20px; 
            letter-spacing: 2px; font-weight: 700; border-bottom: 1px solid var(--border-glass); padding-bottom: 15px; 
        }
        .intro-text { font-size: 15px; line-height: 1.7; color: #ddd; margin-bottom: 25px; font-weight: 300; }
        .intro-btn {
            background: var(--primary); color: #000; border: none; padding: 12px 30px;
            font-size: 14px; font-weight: bold; border-radius: 30px; cursor: pointer;
            transition: 0.3s; letter-spacing: 1px;
        }
        .intro-btn:hover { background: #fff; transform: translateY(-2px); }

        /* --- MODERN MENÜ --- */
        .layer-control-container {
            position: absolute; top: 20px; right: 20px; z-index: 10;
            display: flex; flex-direction: column; align-items: flex-end;
        }
        .settings-btn {
            width: 45px; height: 45px; background: var(--bg-glass); border: 1px solid var(--border-glass);
            border-radius: 50%; color: #fff; font-size: 20px;
            display: flex; justify-content: center; align-items: center; cursor: pointer;
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); transition: 0.3s;
        }
        .settings-btn:hover, .settings-btn.active { background: var(--primary); color: #000; border-color: var(--primary); }
        
        .layer-content {
            display: none; margin-top: 15px; background: var(--bg-glass);
            padding: 20px; border-radius: 12px; border: 1px solid var(--border-glass);
            width: 200px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); animation: fadeDown 0.3s ease;
        }
        @keyframes fadeDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        
        .layer-title { color: #fff; font-size: 13px; font-weight: 600; margin-bottom: 15px; letter-spacing: 1px; }
        .layer-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; border-bottom: 1px solid var(--border-glass); padding-bottom: 15px; }
        
        .custom-radio { display: flex; align-items: center; color: #bbb; font-size: 13px; cursor: pointer; transition: 0.2s; }
        .custom-radio:hover { color: #fff; }
        .custom-radio input { display: none; }
        .radio-mark { 
            width: 16px; height: 16px; border: 2px solid #555; border-radius: 50%; 
            margin-right: 10px; display: inline-block; position: relative; transition: 0.2s;
        }
        .custom-radio input:checked + .radio-mark { border-color: var(--primary); }
        .custom-radio input:checked + .radio-mark::after {
            content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 8px; height: 8px; background: var(--primary); border-radius: 50%;
        }

        .switch-wrapper { display: flex; align-items: center; justify-content: space-between; color: #fff; font-size: 13px; cursor: pointer; }
        .switch { position: relative; display: inline-block; width: 34px; height: 20px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #555; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        .switch input:checked + .slider { background-color: var(--primary); }
        .switch input:checked + .slider:before { transform: translateX(14px); }

        /* --- POPUP TASARIMI (MOBİL UYUMLU) --- */
        .mapboxgl-popup-content { background: #1a1a1a !important; color: #fff !important; border: 1px solid #333 !important; padding: 0 !important; border-radius: 8px !important; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.8); width: 280px; max-width: 90vw; }
        .mapboxgl-popup-tip { border-top-color: #1a1a1a !important; }
        .popup-img { width: 100%; height: 140px; object-fit: cover; display: block; }
        .popup-info { padding: 15px; text-align: left; }
        .popup-info h3 { margin: 0 0 5px 0; font-size: 16px; font-weight: 700; color: #fff; text-transform: uppercase; }
        
        .popup-rating { color: var(--primary); font-size: 13px; margin-bottom: 8px; font-weight: bold; display: flex; align-items: center; gap: 5px; }
        .popup-rating span { color: #999; font-weight: normal; font-size: 12px; }
        
        .popup-desc { font-size: 12px; color: #bbb; margin-bottom: 15px; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
        
        .popup-buttons { display: flex; gap: 8px; }
        .popup-btn { flex: 1; display: block; background: var(--primary); color: #000; text-align: center; padding: 10px 5px; font-weight: 700; text-decoration: none; border-radius: 4px; font-size: 11px; transition: 0.2s; letter-spacing: 0.5px; }
        .popup-btn.route { background: transparent; color: #fff; border: 1px solid #555; }
        .popup-btn:hover { background: #fff; color: #000; border-color: #fff; }
    </style>
</head>
<body>

    <div id="intro-overlay">
        <div class="intro-box">
            <span class="intro-close" onclick="closeIntro()">×</span>
            <h2 class="intro-title">METGEO360 AĞI</h2>
            <div class="intro-text">
                Coğrafi veri sistemimiz entegrasyon aşamasındadır.<br><br>
                Harita üzerinde projelerimizin yoğunluk haritasını görebilir, kümelere tıklayarak ilgili lokasyonlara yaklaşabilir ve sanal turları inceleyebilirsiniz.
            </div>
            <button class="intro-btn" onclick="closeIntro()">SİSTEME GİRİŞ YAP</button>
        </div>
    </div>

    <div class="layer-control-container">
        <div class="settings-btn" onclick="toggleMenu(this)">⚙️</div>
        <div class="layer-content" id="layerMenu">
            <div class="layer-title">HARİTA ALTLIĞI</div>
            <div class="layer-group">
                <label class="custom-radio">
                    <input type="radio" name="style" value="satellite-streets-v12" checked onclick="changeStyle(this.value)">
                    <span class="radio-mark"></span> Uydu (Hibrit)
                </label>
                <label class="custom-radio">
                    <input type="radio" name="style" value="dark-v11" onclick="changeStyle(this.value)">
                    <span class="radio-mark"></span> Gece Modu
                </label>
                <label class="custom-radio">
                    <input type="radio" name="style" value="light-v11" onclick="changeStyle(this.value)">
                    <span class="radio-mark"></span> Sade (2D)
                </label>
            </div>
            
            <label class="switch-wrapper">
                3D Binalar
                <div class="switch">
                    <input type="checkbox" id="buildingToggle" checked onclick="toggleBuildings()">
                    <span class="slider"></span>
                </div>
            </label>
        </div>
    </div>

    <div id="map"></div>

    <script>
        mapboxgl.accessToken = 'pk.eyJ1IjoibWFwZ2VvMzYwIiwiYSI6ImNtbDVzcWw0azA0aWIza3NjMTZoZ21rOWwifQ.agrbCVkuqhdshT8Yy6HuSw';

        let geojsonData = null; 

        function toggleMenu(btn) {
            const menu = document.getElementById('layerMenu');
            if (menu.style.display === 'block') { menu.style.display = 'none'; btn.classList.remove('active'); }
            else { menu.style.display = 'block'; btn.classList.add('active'); }
        }

        function closeIntro() {
            const overlay = document.getElementById('intro-overlay');
            overlay.style.opacity = '0';
            setTimeout(() => { overlay.style.display = 'none'; }, 600);
        }

        const map = new mapboxgl.Map({
            container: 'map',
            style: 'mapbox://styles/mapbox/satellite-streets-v12',
            center: [32.4931, 37.8746],
            zoom: 6,
            pitch: 40,
            antialias: true 
        });

        map.addControl(new mapboxgl.NavigationControl(), 'bottom-right');

        // --- HAREKETLİ NABIZ İKONU ---
        const size = 150;
        const pulsingDot = {
            width: size, height: size,
            data: new Uint8Array(size * size * 4),
            onAdd: function () {
                const canvas = document.createElement('canvas');
                canvas.width = this.width; canvas.height = this.height;
                this.context = canvas.getContext('2d', { willReadFrequently: true });
            },
            render: function () {
                const duration = 2000;
                const t = (performance.now() % duration) / duration;
                const radius = (size / 2) * 0.3;
                const outerRadius = (size / 2) * 0.7 * t + radius;
                const context = this.context;
                
                context.clearRect(0, 0, this.width, this.height);
                context.beginPath();
                context.arc(this.width / 2, this.height / 2, outerRadius, 0, Math.PI * 2);
                context.fillStyle = `rgba(248, 151, 20, ${1 - t})`; 
                context.fill();

                context.beginPath();
                context.arc(this.width / 2, this.height / 2, radius, 0, Math.PI * 2);
                context.fillStyle = '#000000';
                context.strokeStyle = '#F89714';
                context.lineWidth = 4;
                context.fill();
                context.stroke();

                this.data = context.getImageData(0, 0, this.width, this.height).data;
                map.triggerRepaint();
                return true;
            }
        };

        map.on('style.load', () => {
            map.setFog({ 'range': [1, 10], 'color': '#000', 'horizon-blend': 0.1 });
            map.addSource('mapbox-dem', { 'type': 'raster-dem', 'url': 'mapbox://mapbox.mapbox-terrain-dem-v1', 'tileSize': 512, 'maxzoom': 14 });
            map.setTerrain({ 'source': 'mapbox-dem', 'exaggeration': 1.5 });
            
            if (!map.hasImage('pulsing-dot')) map.addImage('pulsing-dot', pulsingDot, { pixelRatio: 2 });
            if(document.getElementById('buildingToggle').checked) add3DBuildings();

            // Katmanları yeniden kur (Stil değişimi sorununu çözer)
            if (geojsonData) {
                setupMapLayers();
            } else {
                fetchData();
            }
        });

        function fetchData() {
            // Canlı ortam için Cache-busting (Math.random) kaldırıldı. 
            fetch('tours.json')
                .then(res => res.json())
                .then(data => {
                    const features = data.map(tur => {
                        let lat = parseFloat(tur.lat);
                        let lng = parseFloat(tur.lng);
                        // Hata sigortası: Lat/Lng ters girilirse düzeltir.
                        if(!(lat >= 35 && lat <= 43)) { let temp = lat; lat = lng; lng = temp; }
                        
                        return {
                            'type': 'Feature',
                            'geometry': { 'type': 'Point', 'coordinates': [lng, lat] },
                            'properties': { 
                                'title': tur.isim, 
                                'image': tur.resim, 
                                'url': tur.url,
                                'description': tur.aciklama || 'Bu mekan için henüz bir açıklama girilmemiştir.',
                                'rating': tur.puan || '5.0',
                                'lat': lat,
                                'lng': lng
                            }
                        };
                    });
                    
                    geojsonData = { 'type': 'FeatureCollection', 'features': features };
                    setupMapLayers();
                }).catch(err => console.error("Veri çekilemedi. JSON formatını kontrol et:", err));
        }

        function setupMapLayers() {
            // Stil değişince Mapbox source'u siler, bu yüzden tekrar eklememiz lazım.
            if (!map.getSource('points')) {
                map.addSource('points', {
                    'type': 'geojson',
                    'data': geojsonData,
                    'cluster': true,
                    'clusterMaxZoom': 14,
                    'clusterRadius': 50 
                });
            }

            if (!map.getLayer('clusters')) {
                map.addLayer({
                    id: 'clusters',
                    type: 'circle',
                    source: 'points',
                    filter: ['has', 'point_count'],
                    paint: {
                        'circle-color': ['step', ['get', 'point_count'], '#F89714', 10, '#e74c3c', 30, '#8e44ad'],
                        'circle-radius': ['step', ['get', 'point_count'], 20, 10, 30, 30, 40],
                        'circle-stroke-width': 2,
                        'circle-stroke-color': '#fff'
                    }
                });

                map.addLayer({
                    id: 'cluster-count',
                    type: 'symbol',
                    source: 'points',
                    filter: ['has', 'point_count'],
                    layout: {
                        'text-field': '{point_count_abbreviated}',
                        'text-font': ['DIN Offc Pro Medium', 'Arial Unicode MS Bold'],
                        'text-size': 14
                    },
                    paint: { 'text-color': '#ffffff' }
                });

                map.addLayer({
                    'id': 'unclustered-point',
                    'type': 'symbol',
                    'source': 'points',
                    'filter': ['!', ['has', 'point_count']],
                    'layout': {
                        'icon-image': 'pulsing-dot',
                        'icon-allow-overlap': true
                    }
                });

                map.on('click', 'clusters', (e) => {
                    const features = map.queryRenderedFeatures(e.point, { layers: ['clusters'] });
                    const clusterId = features[0].properties.cluster_id;
                    map.getSource('points').getClusterExpansionZoom(clusterId, (err, zoom) => {
                        if (err) return;
                        map.easeTo({ center: features[0].geometry.coordinates, zoom: zoom });
                    });
                });

                map.on('click', 'unclustered-point', (e) => {
                    const coordinates = e.features[0].geometry.coordinates.slice();
                    const props = e.features[0].properties;

                    while (Math.abs(e.lngLat.lng - coordinates[0]) > 180) {
                        coordinates[0] += e.lngLat.lng > coordinates[0] ? 360 : -360;
                    }
                    
                    map.flyTo({ center: coordinates, zoom: 16, pitch: 50 });

                    // NaN hatasını engellemek için güvenlik
                    const score = parseFloat(props.rating) || 5;
                    const stars = '★'.repeat(Math.round(score)) + '☆'.repeat(5 - Math.round(score));
                    
                    const routeUrl = `https://www.google.com/maps/dir/?api=1&destination=${props.lat},${props.lng}`;

                    new mapboxgl.Popup({ offset: 15, closeButton: false, maxWidth: '300px' })
                        .setLngLat(coordinates)
                        .setHTML(`
                            <img src="${props.image}" class="popup-img">
                            <div class="popup-info">
                                <h3>${props.title}</h3>
                                <div class="popup-rating">${stars} <span>(${score.toFixed(1)})</span></div>
                                <div class="popup-desc">${props.description}</div>
                                <div class="popup-buttons">
                                    <a href="${props.url}" class="popup-btn" target="_blank">TURA GİT</a>
                                    <a href="${routeUrl}" class="popup-btn route" target="_blank">YOL TARİFİ</a>
                                </div>
                            </div>
                        `).addTo(map);
                });

                map.on('mouseenter', 'clusters', () => { map.getCanvas().style.cursor = 'pointer'; });
                map.on('mouseleave', 'clusters', () => { map.getCanvas().style.cursor = ''; });
                map.on('mouseenter', 'unclustered-point', () => { map.getCanvas().style.cursor = 'pointer'; });
                map.on('mouseleave', 'unclustered-point', () => { map.getCanvas().style.cursor = ''; });
            }
        }

        function add3DBuildings() {
            if (map.getLayer('3d-buildings')) return;
            const layers = map.getStyle().layers;
            const labelLayerId = layers.find((l) => l.type === 'symbol' && l.layout['text-field']);
            const insertBefore = labelLayerId ? labelLayerId.id : undefined;
            
            map.addLayer({
                'id': '3d-buildings', 'source': 'composite', 'source-layer': 'building',
                'filter': ['==', 'extrude', 'true'], 'type': 'fill-extrusion', 'minzoom': 13,
                'paint': {
                    'fill-extrusion-color': '#aaa', 'fill-extrusion-height': ['get', 'height'],
                    'fill-extrusion-base': ['get', 'min_height'], 'fill-extrusion-opacity': 0.8
                }
            }, insertBefore);
        }

        function toggleBuildings() {
            const isChecked = document.getElementById('buildingToggle').checked;
            if (isChecked) { add3DBuildings(); map.setLayoutProperty('3d-buildings', 'visibility', 'visible'); }
            else { if(map.getLayer('3d-buildings')) map.setLayoutProperty('3d-buildings', 'visibility', 'none'); }
        }

        function changeStyle(styleID) {
            map.setStyle('mapbox://styles/mapbox/' + styleID);
        }
    </script>
</body>
</html>
