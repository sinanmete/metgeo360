<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MetGeo360 | Proje Haritası</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.Default.css" />
    <script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>

    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: sans-serif; }
        #map { height: 100%; width: 100%; }
        
        /* Marka Logosu (Sol Üst) */
        .brand-box {
            position: absolute;
            top: 20px; left: 60px; z-index: 1000;
            background: rgba(0, 0, 0, 0.8);
            color: #f1c40f;
            padding: 15px 25px;
            border-radius: 8px;
            border: 2px solid #f1c40f;
            text-align: center;
        }
        .brand-box h1 { margin: 0; font-size: 24px; letter-spacing: 2px; }
        .brand-box p { margin: 5px 0 0; color: #fff; font-size: 12px; }

        /* Popup (Baloncuk) Tasarımı */
        .leaflet-popup-content-wrapper { border-radius: 0px; padding: 0; overflow: hidden; }
        .leaflet-popup-content { margin: 0; width: 260px !important; }
        .popup-img { width: 100%; height: 150px; object-fit: cover; display: block; }
        .popup-info { padding: 15px; text-align: center; }
        .popup-info h3 { margin: 0 0 10px; color: #333; font-size: 18px; }
        .btn-git {
            display: inline-block; background: #f1c40f; color: #000; 
            text-decoration: none; padding: 8px 20px; font-weight: bold;
            border-radius: 4px; transition: 0.3s;
        }
        .btn-git:hover { background: #d4ac0d; }
    </style>
</head>
<body>

    <div class="brand-box">
        <h1>METGEO360</h1>
        <p>METEHAN HARİTA MÜHENDİSLİK</p>
    </div>

    <div id="map"></div>

    <script>
        // Haritayı Başlat (Konya Odaklı)
        var map = L.map('map').setView([37.8716, 32.4853], 10);

        // Google Hibrit Harita Katmanı (Uydu + Sokak İsimleri)
        L.tileLayer('http://{s}.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
            maxZoom: 20,
            subdomains: ['mt0', 'mt1', 'mt2', 'mt3']
        }).addTo(map);

        // Kümeleme (Çoklu noktaları birleştirme)
        var markers = L.markerClusterGroup();

        // Verileri Çek
        fetch('tours.json')
            .then(response => response.json())
            .then(data => {
                data.forEach(tur => {
                    // Özel İkon (İstersen sonra değiştiririz)
                    var myIcon = L.icon({
                        iconUrl: 'https://cdn-icons-png.flaticon.com/512/684/684908.png', // Basit bir konum ikonu
                        iconSize: [32, 32],
                        iconAnchor: [16, 32],
                        popupAnchor: [0, -30]
                    });

                    var marker = L.marker([tur.lat, tur.lng], {icon: myIcon});
                    
                    var popupIcerik = `
                        <div>
                            <img src="${tur.resim}" class="popup-img">
                            <div class="popup-info">
                                <h3>${tur.isim}</h3>
                                <a href="${tur.url}" class="btn-git" target="_blank">SANAL TURU BAŞLAT</a>
                            </div>
                        </div>
                    `;
                    
                    marker.bindPopup(popupIcerik);
                    markers.addLayer(marker);
                });
                map.addLayer(markers);
            })
            .catch(err => console.error("Veri okunamadı:", err));
    </script>
</body>
</html>
